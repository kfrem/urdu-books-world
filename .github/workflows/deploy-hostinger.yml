name: Deploy to Hostinger

# Deploys the PHP storefront to Hostinger whenever main changes.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    env:
      HOSTINGER_FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
      HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
      HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
      HOSTINGER_FTP_TARGET_DIR: ${{ secrets.HOSTINGER_FTP_TARGET_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Hostinger FTP configuration
        if: env.HOSTINGER_FTP_HOST == '' || env.HOSTINGER_FTP_USERNAME == '' || env.HOSTINGER_FTP_PASSWORD == '' || env.HOSTINGER_FTP_TARGET_DIR == ''
        run: |
          echo "Hostinger FTP secrets are not configured yet. Skipping deployment."

      - name: Install FTP client
        if: env.HOSTINGER_FTP_HOST != '' && env.HOSTINGER_FTP_USERNAME != '' && env.HOSTINGER_FTP_PASSWORD != '' && env.HOSTINGER_FTP_TARGET_DIR != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy files by FTP
        if: env.HOSTINGER_FTP_HOST != '' && env.HOSTINGER_FTP_USERNAME != '' && env.HOSTINGER_FTP_PASSWORD != '' && env.HOSTINGER_FTP_TARGET_DIR != ''
        run: |
          lftp -u "$HOSTINGER_FTP_USERNAME","$HOSTINGER_FTP_PASSWORD" "$HOSTINGER_FTP_HOST" <<EOF
          set ftp:ssl-allow no
          set net:max-retries 2
          set net:timeout 20
          cd "$HOSTINGER_FTP_TARGET_DIR"
          mirror --reverse --verbose \
            --exclude-glob .git/ \
            --exclude-glob .git/** \
            --exclude-glob .github/ \
            --exclude-glob .github/** \
            --exclude-glob README.md \
            --exclude-glob urdubooksworld.zip \
            --exclude-glob Urdu_Books_World_Business_Plan_2025.docx \
            --exclude-glob includes/config.local.php \
            --exclude-glob admin/install.lock \
            ./ ./
          bye
          EOF
